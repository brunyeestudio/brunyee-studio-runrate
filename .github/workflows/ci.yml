name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Lint
        run: pnpm lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node
      # Fails the build when coverage drops below the thresholds configured in
      # vite.config.ts (see the "Testing & coverage requirements" section in
      # AGENTS.md). Raising thresholds is part of the coverage work.
      - name: Unit tests with coverage gate
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Build Storybook
        run: pnpm build-storybook

  # Playwright app e2e is not wired yet (UI coverage is Storybook). Enable when
  # e2e/ and playwright.config.ts exist.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e
        run: pnpm test:e2e
